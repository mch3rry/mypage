---
layout: default
title: Birth Science Ottawa - Let's Connect!
---

<!--
  To make this form work you have to:
  1. defined "email: youremail@email.com" in _config.yml file.
  2. verify your form on formspree.io.
-->

<main id="main" class="site-main">
  <div class="post-full inner">
    <header class="post-header">
      <h1 class="post-title">Let's Connect!</h1>
    </header>
    {% if site.contact_page_description %}
    <p>{{ site.contact_page_description }}</p>
    {{else}}
    {% endif %}
    <section class="contact-form">

      <form action="https://submit-form.com/QsYxedwob">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" placeholder="Name" required />
  <label for="email">Email</label>
  <input type="email" id="email" name="email" placeholder="Email" required />
  <label for="message">Tell me about you and your family.</label>
  <textarea id="message" name="message" placeholder="Message" required></textarea>
  <label class="form-label">Where did you hear about Birth Science?</label>
          <select id="source" name="source">
            <option value="OVDA">Ottawa Valley Doulas</option>
            <option value="DoulaMatch">Doula Match</option>
            <option value="Google">Google</option>
            <option value="Recommendation">Personal recommendation</option>
            <option value="Other">Other</option>
          </select>
  <button type="submit">Send</button>
      </form>

      
    </section>
  </div><!-- .inner-->
</main>
